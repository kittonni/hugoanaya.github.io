 .source-serif-4-<uniquifier> {

  body {

  }

  .anchorimage {
    max-height: 100vh;
    max-width: 45vw;
    height: 100vh;
    position: absolute;

    justify-content: center;

  }

  .setmenu {
    font-family: "Geist Pixel Square", serif;
    font-size: 2rem;

    overflow: hidden;

  .setmenu a {
    transition: .1s ease-in-out all;

  }

  .setmenu a:hover {
    transition: .1s ease-in-out all;

    text-decoration: none;
  }


  .projects {
    font-family: "Source Serif 4", serif;
    font-weight: 50;
    font-size: 2.8rem;
    color: #7D7D7D;
    line-height: 5rem;
    kerning: optical;
    position: absolute;
    overflow: hidden;
    right: 50vw;
    top: 25vh;
    text-align: right;
    opacity: 0;
    visibility: hidden;
    transition: opacity .4s linear, visibility .4s linear;
  }

  .projects.is-visible {
    opacity: 1;
    visibility: visible;
  }

  .projects a {
    transition: .2s ease-in-out all;
    color: inherit;
    text-decoration: none;
    list-style: none;
  }

  .projects a:hover {
