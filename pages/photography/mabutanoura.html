  :root {

  * { box-sizing: border-box; }

  }

  }

    font-optical-sizing: auto;
  }  

  body {
    font-family: "Source Serif 4", serif;
    font-size: 1em;
    font-weight: 300;
    width: 100vw;
    height: 100vh;
    background: #FFFFFF;
    cursor: url("../../assets/cursor.svg") 5 5, default;
    overflow: hidden;
  }

  a {
    cursor: url("../../assets/cursorhover.svg") 5 5, pointer;
  }

  h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 8px; max-width: 1200px; margin-inline: auto; }
  p.note { max-width: 1200px; margin: 0 auto 24px; font-size: 0.85rem; color: #666; }

  .logo{
    position: fixed;
    z-index: 999;
    right: 2vw;
    bottom: 5vh;
    width: 3vw;
    height: 3vh;
  }

  .masonry-grid {
    max-width: 95vw;
    max-height: 100vh;
    margin: 0 auto;
    padding: 15vh 0 2vh;
    display: grid;
    overflow: scroll;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: var(--row-height);
    grid-auto-flow: dense;
    gap: var(--gap);
    scrollbar-width: none;
  }

  .masonry-item {
    overflow: hidden;
    position: relative;
  }

  .masonry-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .topbar {
    width: 100vw;
    height: 15vh;
    position: absolute;
    z-index: 1;
    background: #fff;
    font-family: "Geist Pixel Circle";
    font-size: 4rem;
    text-transform: uppercase;
    padding-left: 2.2vw;
    padding-top: 3vh;
  }

  .anchor-image {
    grid-column: 2 / 3;  
    grid-row: 21 / 61;
  }

  .copy-block {
    grid-column: 1 / 3; 
    grid-row: 31 / 41;
    color: #000;
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }
  .copy-block h2 { margin: 0; font-size: 1.3rem; font-weight: 600; }
  .copy-block p { margin: 0; font-size: 1.2rem; line-height: 1.5; color: #000; }

  @media (max-width: 900px) {
    .masonry-grid { grid-template-columns: repeat(2, 1fr); }
    .anchor-image, .copy-block { grid-column: auto; grid-row: auto; }
    .copy-block { grid-column: span 2; }
    .topbar { font-size: 2.6rem; height: 12vh; padding-top: 2.5vh; }
    .logo { width: 40px; height: 40px; }
  }
  @media (max-width: 560px) {
    .masonry-grid { grid-template-columns: 1fr; padding: 9vh 0 4vh; gap: 10px; }
    .anchor-image { grid-column: auto; grid-row: auto; }
    .copy-block { grid-column: auto; grid-row: auto; }
    .topbar { font-size: 1.6rem; height: 9vh; padding-left: 5vw; padding-top: 2vh; letter-spacing: -0.01em; }
    .logo { width: 32px; height: 32px; right: 4vw; bottom: 3vh; }
    .copy-block h2 { font-size: 1.1rem; }
    .copy-block p { font-size: 1rem; line-height: 1.4; }
  }
</style>

<script>
(function () {
  const TARGET_LONG_EDGE = 700; 
  const grid = document.getElementById('gallery');

  function getColumnCount() {
    return getComputedStyle(grid).gridTemplateColumns.split(' ').length;
  }

  function layout() {
    const cols = getColumnCount();
    const gapPx = parseFloat(getComputedStyle(grid).columnGap) || 16;
    const rowUnit = parseFloat(getComputedStyle(grid).gridAutoRows) || 8;
    const gridWidth = grid.getBoundingClientRect().width;
    const colWidth = (gridWidth - gapPx * (cols - 1)) / cols;
    const maxColSpan = Math.min(cols, 3);

    grid.querySelectorAll('.auto-size').forEach(item => {
      const img = item.querySelector('img');
      if (!img || !img.naturalWidth) return;

      const ratio = img.naturalWidth / img.naturalHeight;
      let colSpan, rowSpan;

      if (ratio > 1.05) {
        colSpan = Math.round((TARGET_LONG_EDGE + gapPx) / (colWidth + gapPx));
        colSpan = maxColSpan >= 2
          ? Math.max(2, Math.min(maxColSpan, colSpan))
          : 1;

        const renderedWidth = colSpan * colWidth + (colSpan - 1) * gapPx;
        const renderedHeight = renderedWidth / ratio;
        rowSpan = Math.max(1, Math.round((renderedHeight + gapPx) / (rowUnit + gapPx)));

      } else if (ratio < 0.95) {
        colSpan = Math.min(2, maxColSpan);
        const renderedWidth = colSpan * colWidth + (colSpan - 1) * gapPx;
        const renderedHeight = renderedWidth / ratio;
        rowSpan = Math.max(1, Math.round((renderedHeight + gapPx) / (rowUnit + gapPx)));

      } else {
        colSpan = 1;
        rowSpan = Math.max(1, Math.round((colWidth + gapPx) / (rowUnit + gapPx)));
      }

      item.style.gridColumn = `span ${colSpan}`;
      item.style.gridRow = `span ${rowSpan}`;
    });
  }

  function whenImagesReady(callback) {
    const imgs = Array.from(grid.querySelectorAll('img'));
    let remaining = imgs.length;
    if (remaining === 0) return callback();
    imgs.forEach(img => {
      if (img.complete && img.naturalWidth) {
        if (--remaining === 0) callback();
      } else {
        img.addEventListener('load', () => { if (--remaining === 0) callback(); });
        img.addEventListener('error', () => { if (--remaining === 0) callback(); });
      }
    });
  }

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 150);
  });

  whenImagesReady(layout);
})();
</script>
